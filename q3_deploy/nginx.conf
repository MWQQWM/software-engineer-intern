# proxy_pass without a URI keeps /api/* and /ocr/parse unchanged.
# 10m covers the sample CSV and leaves room for larger staff uploads.
# 60s is longer than the API OCR client timeout (5s) so nginx is not the
# first timeout; staff still see a response if OCR hangs at 600s.
server {
    listen 80;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
    }

    location /ocr/ {
        proxy_pass http://mock_ocr:9100;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
    }
}
