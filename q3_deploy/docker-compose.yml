services:
  api:
    build:
      context: ..
      dockerfile: q3_deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
      OCR_URL: http://mock_ocr:9100/ocr/parse
      ONBOARDING_URL: http://mock_onboarding:9200/ingest
    volumes:
      - api_data:/data
    depends_on:
      mock_ocr:
        condition: service_healthy
      mock_onboarding:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mock_ocr:
    build: ../mock_ocr
    environment:
      OCR_PORT: "9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/online')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mock_onboarding:
    build: ../mock_onboarding
    environment:
      ONBOARDING_PORT: "9200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/online')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
