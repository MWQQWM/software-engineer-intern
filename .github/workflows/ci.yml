name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        run: python -m pytest q1_api/
      - name: Build Compose images
        run: |
          cp q3_deploy/.env.example q3_deploy/.env
          docker compose -f q3_deploy/docker-compose.yml --project-directory q3_deploy build
